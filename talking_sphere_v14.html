<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talking Binary Sphere v6 Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center}
canvas{display:block;width:100%;height:100%;background:radial-gradient(circle at center,#111 0%,#000 100%)}
#status{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:#0f0;font:13px monospace;line-height:1.45;background:rgba(0,0,0,.88);padding:10px 16px;border:1px solid #333;border-radius:10px;z-index:10;text-align:center;min-width:360px;pointer-events:none;white-space:pre-line}
#controls{position:fixed;top:14px;left:14px;z-index:20;display:flex;gap:7px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 28px)}
button,label{font:12px monospace;color:#0f0;background:rgba(0,0,0,.82);border:1px solid #444;padding:7px 10px;border-radius:5px;cursor:pointer}
button:hover,label:hover{border-color:#0f0;background:rgba(0,255,0,.08)}
input[type=file]{display:none}
#trackName{color:#777;font:12px monospace;background:rgba(0,0,0,.65);padding:7px 9px;border-radius:5px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mic-button{display:none}
#hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.3);font:24px monospace;text-align:center;pointer-events:none;z-index:5}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="controls">
  <button id="micButton">🎤 Microphone</button>
  <label for="mp3Input">▶ Load MP3</label>
  <button id="playButton" disabled>▶ Play</button>
  <input id="mp3Input" type="file" accept="audio/mpeg,audio/mp3,audio/*">
  <button id="stopButton">■ Stop</button>
  <span id="trackName">No MP3 loaded</span>
</div>

<div id="hint">Click Microphone, or load an MP3</div>
<div id="status">NORMAL · RAINBOW · GRID 40 × 80</div>
<audio id="audio" controls style="display:none"></audio>

<script>
(() => {
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');
const hint=document.getElementById('hint');
const micButton=document.getElementById('micButton');
const mp3Input=document.getElementById('mp3Input');
const playButton=document.getElementById('playButton');
const stopButton=document.getElementById('stopButton');
const trackName=document.getElementById('trackName');
const controls=document.getElementById('controls');
const audio=document.getElementById('audio');

let width,height;
function resize(){width=innerWidth;height=innerHeight;canvas.width=width;canvas.height=height}
addEventListener('resize',resize); resize();

let audioContext=null, analyser=null, dataArray=null;
let micStream=null, micSource=null, mediaSource=null;
let currentObjectURL=null;
let audioReady=false, audioType='none';
let volume=0,bassLevel=0,highLevel=0;
let angleY=0;
let mode=0; // 0 normal, 1 display/deformation, 2 frequency
let colorMode='rainbow';
let showBackfaces=false; // B toggles background/back-facing glyphs
let showInfo=true; // I toggles onscreen information
let detectionMode='speech'; // V toggles speech-focused detection / existing volume detection
let speechLevel=0;
let previousSpectrum=null;

// These are deliberately coupled: ↑/↓ changes both together.
let numTheta=40;
let numPhi=80;
const GRID_STEP=5;
const MIN_THETA=10, MAX_THETA=80;

let fontSize=12;
const FONT_SIZE_STEP=.5;
const MIN_FONT_SIZE=6, MAX_FONT_SIZE=24;
const MIN_PHI=20, MAX_PHI=160;

// Audio response controls.
// ↑/↓ = sensitivity, ←/→ = response curve.
let volumeSensitivity=1.2;
let responseCurve=3.0;
const SENSITIVITY_STEP=.1;
const MIN_SENSITIVITY=.1, MAX_SENSITIVITY=5.0;
const CURVE_STEP=.1;
const MIN_CURVE=.3, MAX_CURVE=3.0;

const BASE_RADIUS=280;
const MAX_RADIUS_MULTIPLIER=2.5;
const distance=340;
const NOISE_GATE=.03;

// Frequency-mode smoothing, one value per sphere row.
let rowEnergy=[];

async function ensureAudioContext(){
  if(!audioContext) audioContext=new (window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==='suspended') await audioContext.resume();
  if(!analyser){
    analyser=audioContext.createAnalyser();
    analyser.fftSize=256;
    analyser.smoothingTimeConstant=.72;
    dataArray=new Uint8Array(analyser.frequencyBinCount);
  }
}

function disconnectSources(){
  try{if(micSource)micSource.disconnect()}catch(e){}
  // Keep MediaElementSource alive. Browsers allow only one
  // MediaElementSource per <audio> element, so it is reused for new MP3s.
  micSource=null;
}

function useAnalyserSource(source,type){
  ensureAudioContext();
  disconnectSources();
  source.connect(analyser);
  analyser.connect(audioContext.destination);
  audioType=type;
  audioReady=true;
  hint.style.display='none';
}

async function startMicrophone(){
  try{
    ensureAudioContext();
    if(micStream) micStream.getTracks().forEach(t=>t.stop());
    micStream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},
      video:false
    });
    const source=audioContext.createMediaStreamSource(micStream);
    // Microphone is analysed but not routed back to the speakers.
    disconnectSources();
    source.connect(analyser);
    micSource=source;
    audioType='mic';
    audioReady=true;
    previousSpectrum=null;
    hint.style.display='none';
    trackName.textContent='Microphone';
    statusEl.textContent=makeStatus();
  }catch(err){
    console.warn(err);
    statusEl.textContent='Microphone access denied or unavailable';
  }
}

async function loadMP3(file){
  if(!file)return;
  try{
    await ensureAudioContext();

    if(micStream){
      micStream.getTracks().forEach(t=>t.stop());
      micStream=null;
    }

    audio.pause();
    disconnectSources();

    if(currentObjectURL) URL.revokeObjectURL(currentObjectURL);
    currentObjectURL=URL.createObjectURL(file);
    audio.src=currentObjectURL;
    audio.load();

    if(!mediaSource){
      mediaSource=audioContext.createMediaElementSource(audio);
      mediaSource.connect(analyser);
      analyser.connect(audioContext.destination);
    }

    audioType='mp3';
    audioReady=true;
    previousSpectrum=null;
    trackName.textContent=file.name;
    hint.style.display='none';
    playButton.disabled=false;
    statusEl.textContent='Loading MP3…';

    if(audio.readyState < HTMLMediaElement.HAVE_FUTURE_DATA){
      await new Promise((resolve,reject)=>{
        const ready=()=>{cleanup();resolve()};
        const error=()=>{cleanup();reject(audio.error||new Error('Audio load failed'))};
        const cleanup=()=>{
          audio.removeEventListener('canplay',ready);
          audio.removeEventListener('error',error);
        };
        audio.addEventListener('canplay',ready,{once:true});
        audio.addEventListener('error',error,{once:true});
      });
    }

    await audioContext.resume();
    await audio.play();
    playButton.textContent='⏸ Pause';
    statusEl.textContent=makeStatus();
  }catch(err){
    console.error('MP3 playback error:',err);
    audioReady=false;
    playButton.disabled=false;
    playButton.textContent='▶ Play';
    statusEl.textContent='MP3 loaded · press Play';
  }
}

function stopAudio(){
  audio.pause();
  audio.currentTime=0;
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
  disconnectSources();
  audioType='none';
  audioReady=false;
  volume=bassLevel=highLevel=0;
  trackName.textContent='No audio source';
  playButton.disabled=true;
  playButton.textContent='▶ Play';
  hint.style.display='block';
  statusEl.textContent=makeStatus();
}

micButton.onclick=()=>startMicrophone();
mp3Input.onchange=e=>loadMP3(e.target.files[0]);

playButton.onclick=async()=>{
  if(!audio.src)return;
  try{
    await ensureAudioContext();
    if(audio.paused){
      await audio.play();
      playButton.textContent='⏸ Pause';
    }else{
      audio.pause();
      playButton.textContent='▶ Play';
    }
  }catch(err){
    console.warn('Playback error:',err);
    statusEl.textContent='Unable to play MP3';
  }
};

audio.addEventListener('play',()=>playButton.textContent='⏸ Pause');
audio.addEventListener('pause',()=>{
  if(audio.currentTime<audio.duration) playButton.textContent='▶ Play';
});
audio.addEventListener('ended',()=>playButton.textContent='▶ Play');
audio.addEventListener('error',()=>{
  statusEl.textContent='Could not decode this audio file';
  playButton.textContent='▶ Play';
});

stopButton.onclick=()=>stopAudio();

document.addEventListener('keydown',e=>{
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','[',']'].includes(e.key)) e.preventDefault();

  if(e.key==='1') colorMode='rainbow';
  else if(e.key==='2') colorMode='green';
  else if(e.key==='3') colorMode='blueRed';
  else if(e.key==='4') colorMode='white';
  else if(e.key.toLowerCase()==='b') showBackfaces=!showBackfaces;
  else if(e.key.toLowerCase()==='v') detectionMode=detectionMode==='speech'?'volume':'speech';
  else if(e.key.toLowerCase()==='i') showInfo=!showInfo;

  else if(e.key===' '){
    mode=(mode+1)%3;
  }

  // Arrow keys control audio response, keeping the display free of sliders.
  else if(e.key==='ArrowUp'){
    volumeSensitivity=Math.min(MAX_SENSITIVITY,volumeSensitivity+SENSITIVITY_STEP);
  }
  else if(e.key==='ArrowDown'){
    volumeSensitivity=Math.max(MIN_SENSITIVITY,volumeSensitivity-SENSITIVITY_STEP);
  }
  else if(e.key==='ArrowRight'){
    responseCurve=Math.min(MAX_CURVE,responseCurve+CURVE_STEP);
  }
  else if(e.key==='ArrowLeft'){
    responseCurve=Math.max(MIN_CURVE,responseCurve-CURVE_STEP);
  }

  // A/S change both dimensions together, maintaining the 1:2 relationship.
  else if(e.key.toLowerCase()==='a'){
    if(numTheta>MIN_THETA){
      numTheta-=GRID_STEP;
      numPhi-=GRID_STEP*2;
    }
  }
  else if(e.key.toLowerCase()==='s'){
    if(numTheta<MAX_THETA){
      numTheta+=GRID_STEP;
      numPhi+=GRID_STEP*2;
    }
  }
  else if(e.key==='['){
    fontSize=Math.max(MIN_FONT_SIZE,fontSize-FONT_SIZE_STEP);
  }
  else if(e.key===']'){
    fontSize=Math.min(MAX_FONT_SIZE,fontSize+FONT_SIZE_STEP);
  }
});

function modeName(){
  return ['NORMAL','DISPLAY','FREQUENCY'][mode];
}
function colorName(){
  return {rainbow:'RAINBOW',green:'GREEN',blueRed:'BLUE → RED',white:'WHITE'}[colorMode];
}
function makeStatus(){
  return `${modeName()} · ${colorName()} · GRID ${numTheta} × ${numPhi}`;
}

function getVolume(){
  if(!audioReady||!analyser)return 0;
  analyser.getByteFrequencyData(dataArray);
  let sum=0;
  for(let i=0;i<dataArray.length;i++)sum+=dataArray[i];
  let raw=sum/dataArray.length/255;
  if(raw<NOISE_GATE)raw=0;
  else raw=(raw-NOISE_GATE)/(1-NOISE_GATE);
  volume=volume*.82+raw*.18;
  if(volume<.001)volume=0;

  // Existing volume-based response.
  return Math.min(1,Math.pow(Math.min(1,volume*volumeSensitivity),responseCurve));
}

function getSpeechDetection(){
  if(!audioReady||!analyser)return 0;

  // Refresh the FFT data before measuring speech activity.
  analyser.getByteFrequencyData(dataArray);

  const nyquist=audioContext.sampleRate/2;
  const binHz=nyquist/dataArray.length;
  const lowBin=Math.max(1,Math.floor(100/binHz));
  const highBin=Math.min(dataArray.length-1,Math.ceil(4000/binHz));

  let speechSum=0, speechCount=0, totalSum=0;
  let flux=0;
  for(let i=0;i<dataArray.length;i++){
    const v=dataArray[i]/255;
    totalSum+=v;
    if(i>=lowBin&&i<=highBin){speechSum+=v;speechCount++;}
    if(previousSpectrum) flux+=Math.max(0,v-previousSpectrum[i]/255);
  }

  const speechBand=speechCount?speechSum/speechCount:0;
  const overall=totalSum/dataArray.length;
  const fluxLevel=Math.min(1,flux/(dataArray.length*.12));

  // Speech-focused heuristic: favour the 100 Hz–4 kHz band and spectral
  // movement, while requiring some actual signal to be present.
  const bandRatio=overall>0.01?Math.min(1,speechBand/(overall*1.8)):0;
  const target=Math.max(0,Math.min(1,(bandRatio*.72+fluxLevel*.28)*(speechBand*2.8)));

  speechLevel=speechLevel*.88+target*.12;
  if(speechLevel<.01)speechLevel=0;

  if(!previousSpectrum)previousSpectrum=new Uint8Array(dataArray.length);
  previousSpectrum.set(dataArray);

  return Math.min(1,Math.pow(Math.min(1,speechLevel*volumeSensitivity),responseCurve));
}

function updateBands(){
  if(!audioReady||!analyser){bassLevel*=.9;highLevel*=.9;return}
  let bass=0,high=0,bc=0,hc=0;
  // Low bins are bass. Upper quarter is treble.
  for(let i=0;i<Math.min(8,dataArray.length);i++){bass+=dataArray[i];bc++}
  const hs=Math.floor(dataArray.length*.70);
  for(let i=hs;i<dataArray.length;i++){high+=dataArray[i];hc++}
  const rb=bc?bass/bc/255:0;
  const rh=hc?high/hc/255:0;
  bassLevel=bassLevel*.72+rb*.28;
  highLevel=highLevel*.72+rh*.28;
}

function frequencyForRow(i){
  // Map sphere rows from low frequencies at the bottom to high at the top.
  const p=i/(numTheta-1);
  const bin=Math.floor((1-p)*(dataArray.length-1));
  return dataArray[Math.max(0,Math.min(dataArray.length-1,bin))]/255;
}

function updateRowEnergy(){
  if(rowEnergy.length!==numTheta) rowEnergy=new Array(numTheta).fill(0);
  if(mode!==2||!audioReady)return;
  for(let i=0;i<numTheta;i++){
    const target=frequencyForRow(i);
    rowEnergy[i]=rowEnergy[i]*.68+target*.32;
  }
}

function getBinaryChar(theta,phi,rowIndex){
  const val=Math.sin(theta*4.7+phi*3.1)*.8+
            Math.cos(phi*2.3-theta*1.8)*.6;
  let normalized=(val+1.4)/2.8;
  normalized=Math.max(0,Math.min(1,normalized));

  if(mode===2){
    // Frequency mode: each row corresponds to a frequency band.
    // Strong frequency -> more 1s; quiet frequency -> more 0s.
    const energy=rowEnergy[rowIndex]||0;
    const threshold=.70-energy*.62;
    // Add a small stable spatial pattern so the sphere doesn't become a
    // collection of uniform horizontal stripes.
    const spatial=.10*Math.sin(phi*3+theta*8);
    return normalized < threshold+spatial ? '1' : '0';
  }

  // Normal/display modes retain the original stable binary pattern.
  return normalized<.5?'1':'0';
}

function setColour(theta,phi,clamped,front01){
  // Depth lighting is based ONLY on actual camera-facing depth.
  // front01 = 1 at the front surface, 0 at the rear surface.
  // This keeps the front glyphs bright and the rear glyphs subdued.
  const depthLight=.18+.82*Math.pow(Math.max(0,Math.min(1,front01)),.65);

  if(colorMode==='green'){
    const brightness=(80+clamped*175)*depthLight;
    ctx.fillStyle=`rgb(0,${Math.floor(brightness)},0)`;
  }else if(colorMode==='blueRed'){
    const red=Math.floor(255*(1-clamped)*depthLight);
    const blue=Math.floor(255*clamped*depthLight);
    ctx.fillStyle=`rgb(${red},0,${blue})`;
  }else if(colorMode==='white'){
    const b=Math.floor((240-clamped*180)*depthLight);
    ctx.fillStyle=`rgb(${b},${b},${b})`;
  }else{
    const hue=(theta/Math.PI*360+phi*180/Math.PI)%360;
    const lightness=(50+clamped*30)*depthLight;
    ctx.fillStyle=`hsl(${hue},80%,${lightness}%)`;
  }
}

function animate(){
  controls.style.display=showInfo?'flex':'none';
  const vol=detectionMode==='speech'?getSpeechDetection():getVolume();
  updateBands();
  updateRowEnergy();

  let radiusMultiplier=.6;
  if(audioReady&&vol>.01)
    radiusMultiplier=.6+vol*(MAX_RADIUS_MULTIPLIER-.6);
  const R=BASE_RADIUS*radiusMultiplier;

  ctx.clearRect(0,0,width,height);
  const cosY=Math.cos(angleY),sinY=Math.sin(angleY);
  const baseFontSize=fontSize;
  ctx.textAlign='center';
  ctx.textBaseline='middle';

  const currentMinZ=distance-R,currentMaxZ=distance+R;
  const glyphs=[];

  for(let i=0;i<numTheta;i++){
    const theta=(i+.5)*Math.PI/numTheta;
    const phiSteps=Math.max(4,Math.round(numPhi*Math.sin(theta)));

    for(let j=0;j<phiSteps;j++){
      const phi=(j+.5)*2*Math.PI/phiSteps;
      let localR=R;

      if(mode===1&&audioReady&&bassLevel>.01){
        const wave1=Math.sin(theta*5+phi*3);
        const wave2=Math.sin(phi*7-theta*2);
        const deformation=(wave1*.65+wave2*.35)*bassLevel*.45;
        localR=R*(1+deformation);
      }

      const x=localR*Math.sin(theta)*Math.cos(phi);
      const y=localR*Math.cos(theta);
      const z=localR*Math.sin(theta)*Math.sin(phi);

      const xRot=x*cosY-z*sinY;
      const zRot=x*sinY+z*cosY;
      const zFinal=zRot+distance;

      if(zFinal<=2) continue;

      const scale=distance/zFinal;
      const screenX=width/2+xRot*scale;
      const screenY=height/2+y*scale;

      const norm=(zFinal-currentMinZ)/(currentMaxZ-currentMinZ);
      const clamped=Math.max(0,Math.min(1,norm));

      // Camera is on the -Z side: negative zRot is toward the viewer.
      // Map the full sphere depth from rear=0 to front=1.
      const front01=Math.max(0,Math.min(1,(localR-zRot)/(2*Math.max(localR,1))));

      // Backface culling is enabled by default. With the camera on -Z,
      // front-facing points must be slightly inside the silhouette (zRot <= -8% of radius). Press B to show the rear surface.
        //amount of backface culling is controlled by the cullAmount multiplier 
        //0.20 = less culling
        //0.26 = current setting
        //0.30 = more culling
        //0.40 = substantially more culling
        cullAmount=0.50
      if(!showBackfaces && zRot>-localR*cullAmount) continue;

      const depth01=front01*2-1;
      const centreFactor=Math.sqrt(Math.max(0,1-depth01*depth01));
      const sizeFactor=.72+.63*centreFactor;
      const glyphSize=baseFontSize*sizeFactor;

      glyphs.push({
        screenX,screenY,zFinal,theta,phi,clamped,glyphSize,front01,
        char:getBinaryChar(theta,phi,i)
      });
    }
  }

  glyphs.sort((a,b)=>b.zFinal-a.zFinal);

  for(const g of glyphs){
    setColour(g.theta,g.phi,g.clamped,g.front01);
    ctx.font=`${g.glyphSize}px monospace`;
    ctx.fillText(g.char,g.screenX,g.screenY);
  }

  const sourceText=audioType==='mic'?'MIC':audioType==='mp3'?'MP3':'NO AUDIO';
  if(showInfo){
    if(audioReady){
      statusEl.textContent=`${modeName()} · ${colorName()} · GRID ${numTheta} × ${numPhi} · ${sourceText} · VOL ${Math.round(vol*100)}% · SENS ${volumeSensitivity.toFixed(1)} · CURVE ${responseCurve.toFixed(1)} · FONT ${fontSize.toFixed(1)} · DETECT ${detectionMode.toUpperCase()} · BACK ${showBackfaces?'ON':'OFF'}\n\nKEYS  1–4 COLOUR · SPACE MODE · V DETECTION · ↑↓ SENS · ←→ CURVE · [ ] FONT · A/S GRID · B BACKFACES · I INFO`;
    }else{
      statusEl.textContent=`${makeStatus()} · NO AUDIO · FONT ${fontSize.toFixed(1)} · DETECT ${detectionMode.toUpperCase()} · BACK ${showBackfaces?'ON':'OFF'}\n\nKEYS  1–4 COLOUR · SPACE MODE · V DETECTION · ↑↓ SENS · ←→ CURVE · [ ] FONT · A/S GRID · B BACKFACES · I INFO`;
    }
  }else{
    statusEl.textContent='';
  }

  angleY+=.0081;
  requestAnimationFrame(animate);
}
animate();
})();
</script>
</body>
</html>
